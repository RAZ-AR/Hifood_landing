<!DOCTYPE html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hi Food — Već smo otvoreni u Beogradu</title>
  <link rel="icon" type="image/svg+xml" href="Logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --cyan: #00b3eb;
      --black: #080808;
      --white: #f5f5f0;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--black);
      color: var(--white);
      font-family: 'Space Grotesk', sans-serif;
      cursor: none;
    }

    /* ── Custom cursor ── */
    .cursor {
      position: fixed; width: 10px; height: 10px;
      background: var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: difference;
    }
    .cursor-ring {
      position: fixed; width: 36px; height: 36px;
      border: 1.5px solid var(--cyan); border-radius: 50%;
      pointer-events: none; z-index: 9998;
      transform: translate(-50%, -50%); opacity: 0.55;
    }

    /* ══════════════════ HERO ══════════════════ */
    .hero {
      position: relative;
      width: 100vw; height: 100vh;
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    /* Grain overlay */
    .hero::before {
      content: '';
      position: absolute; inset: 0; z-index: 2;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.05'/%3E%3C/svg%3E");
      background-size: 180px; pointer-events: none; opacity: 0.35;
    }

    /* Vignette */
    .hero::after {
      content: '';
      position: absolute; inset: 0; z-index: 2;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(8,8,8,0.45) 100%);
      pointer-events: none;
    }

    /* ── Video ── */
    .video-wrapper { position: absolute; inset: 0; z-index: 1; }
    .video-wrapper video {
      width: 100%; height: 100%; object-fit: cover;
      opacity: 0.9; filter: saturate(1.1) contrast(1.05);
    }

    /* ── Logo (top-left) ── */
    .logo-wrap {
      position: absolute;
      top: clamp(18px, 3vw, 40px);
      left: clamp(18px, 3vw, 44px);
      width: clamp(90px, 11vw, 155px);
      z-index: 5;
      opacity: 0;
      animation: fadeUp 0.9s ease forwards 0.2s;
    }
    .logo-wrap img {
      width: 100%; height: auto;
      filter: drop-shadow(0 0 28px rgba(0,179,235,0.45));
    }

    /* ── Vertical USKORO sides ── */
    .side-word {
      position: absolute; z-index: 3;
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(56px, 8vw, 118px);
      line-height: 1; letter-spacing: 0.08em;
      color: var(--white);
      writing-mode: vertical-rl;
      text-orientation: mixed;
      top: 50%;
      opacity: 0; user-select: none; pointer-events: none;
    }
    .side-word span { color: var(--cyan); }
    .side-left {
      left: clamp(10px, 2vw, 34px);
      transform: translateY(-50%) rotate(180deg);
      animation: fadeIn 1s ease forwards 0.6s;
    }
    .side-right {
      right: clamp(10px, 2vw, 34px);
      transform: translateY(-50%);
      animation: fadeIn 1s ease forwards 0.8s;
    }

    /* ── Center tagline ── */
    .hero-center {
      position: relative; z-index: 3;
      display: flex; flex-direction: column;
      align-items: center; text-align: center;
      gap: 0;
      opacity: 0;
      animation: fadeUp 1s ease forwards 1s;
    }
    .tagline {
      font-size: clamp(10px, 1.2vw, 14px);
      font-weight: 700; letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(245,245,240,0.65);
    }
    .tagline-line {
      display: flex; align-items: center; gap: 16px; margin-bottom: 6px;
    }
    .tagline-line::before,
    .tagline-line::after {
      content: '';
      width: clamp(30px, 6vw, 90px); height: 1px;
      background: var(--cyan); opacity: 0.5;
    }

    /* ── CTA buttons ── */
    .cta-group {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center;
      margin-top: clamp(18px, 2.8vh, 32px);
    }
    .wolt-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #fff;
      color: var(--black);
      text-decoration: none;
      border-radius: 999px;
      padding: clamp(10px, 1.2vh, 14px) clamp(18px, 2.2vw, 30px);
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: filter 0.2s, transform 0.2s;
      cursor: none;
    }
    .wolt-btn:hover { filter: brightness(0.92); transform: scale(1.05); }
    .wolt-btn img { height: clamp(16px, 1.8vw, 22px); width: auto; display: block; filter: brightness(0); }

    .menu-btn {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent;
      color: var(--white);
      text-decoration: none;
      border-radius: 999px;
      border: 1.5px solid rgba(245,245,240,0.35);
      padding: clamp(10px, 1.2vh, 14px) clamp(18px, 2.2vw, 30px);
      font-size: clamp(11px, 1.1vw, 14px);
      font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
      cursor: none;
    }
    .menu-btn:hover { border-color: var(--cyan); color: var(--cyan); transform: scale(1.05); }

    /* ── Top info bar (address + instagram) ── */
    .top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 5;
      padding: clamp(18px, 3vw, 40px) clamp(20px, 4vw, 60px);
      padding-left: clamp(130px, 17vw, 240px);
      background: linear-gradient(to bottom, rgba(8,8,8,0.7) 0%, transparent 100%);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: clamp(12px, 2vw, 28px);
      opacity: 0;
      animation: fadeIn 1s ease forwards 1.3s;
    }

    /* ── Sticker badges ── */
    .badge {
      position: absolute; z-index: 4;
      font-family: 'Bebas Neue', sans-serif;
      letter-spacing: 0.07em; line-height: 1.15;
      pointer-events: none; border-radius: 999px;
    }

    /* badge-3: Kavkaski ukusi — bottom left */
    .badge-3 {
      bottom: clamp(120px, 15vh, 200px);
      left: clamp(60px, 8vw, 110px);
      background: transparent; border: 2px solid var(--cyan); color: var(--cyan);
      font-size: clamp(11px, 1.4vw, 18px);
      padding: 11px 22px; border-radius: 6px;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards 1.9s, badgeFloat3 7s ease-in-out infinite 2.7s;
    }

    /* badge-4: menu — bottom right */
    .badge-4 {
      bottom: clamp(130px, 16vh, 210px);
      right: clamp(60px, 8vw, 110px);
      background: var(--white); color: var(--black);
      font-size: clamp(11px, 1.3vw, 16px);
      padding: 11px 22px; border-radius: 6px;
      opacity: 0;
      animation: fadeIn 0.7s ease forwards 2.2s, badgeFloat4 5.5s ease-in-out infinite 3s;
    }
    .dot {
      display: inline-block; width: 4px; height: 4px;
      background: var(--cyan); border-radius: 50%;
      margin: 0 5px; vertical-align: middle;
    }

    /* ── Bottom info bar ── */
    .info-bar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 5;
      padding: clamp(20px, 3vh, 36px) clamp(20px, 4vw, 60px);
      background: linear-gradient(to top, rgba(8,8,8,0.9) 0%, transparent 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      opacity: 0;
      animation: fadeIn 1s ease forwards 2.4s;
    }

    /* Address — left */
    .info-address {
      display: flex; flex-direction: column; gap: 5px;
      text-decoration: none;
    }
    .info-address .label {
      font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(245,245,240,0.35);
    }
    .info-address .value {
      display: flex; align-items: center; gap: 7px;
      font-size: clamp(12px, 1.2vw, 15px);
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(245,245,240,0.8);
      transition: color 0.25s;
    }
    .info-address .value svg { opacity: 0.6; flex-shrink: 0; transition: opacity 0.25s; }
    .info-address:hover .value { color: var(--cyan); }
    .info-address:hover .value svg { opacity: 1; }

    /* Contact links */
    .contact-links {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex: 1;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 34px;
      padding: 8px 12px;
      border: 1px solid rgba(245,245,240,0.18);
      border-radius: 999px;
      color: rgba(245,245,240,0.82);
      background: rgba(8,8,8,0.2);
      text-decoration: none;
      font-size: clamp(10px, 1vw, 13px);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      white-space: nowrap;
      transition: border-color 0.2s, color 0.2s, background 0.2s, transform 0.2s;
      cursor: none;
    }
    .contact-link svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .contact-link:hover {
      border-color: var(--cyan);
      color: var(--cyan);
      background: rgba(0,179,235,0.1);
      transform: translateY(-1px);
    }

    /* Menu pills — center */
    .info-menu {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .info-menu .menu-label {
      font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(245,245,240,0.3);
    }
    .info-menu .menu-pills {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center;
    }
    .pill {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(12px, 1.3vw, 16px);
      letter-spacing: 0.12em;
      padding: 6px 14px;
      border: 1px solid rgba(245,245,240,0.15);
      border-radius: 999px;
      color: rgba(245,245,240,0.6);
      white-space: nowrap;
    }
    .pill.active {
      border-color: var(--cyan);
      color: var(--cyan);
    }

    /* Instagram — right */
    .info-ig {
      display: flex; flex-direction: column; align-items: flex-end; gap: 5px;
      text-decoration: none;
    }
    .info-ig .label {
      font-size: 9px; letter-spacing: 0.3em; text-transform: uppercase;
      color: rgba(245,245,240,0.35);
    }
    .info-ig .value {
      display: flex; align-items: center; gap: 8px;
      font-size: clamp(12px, 1.2vw, 15px);
      font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(245,245,240,0.8);
      transition: color 0.25s;
    }
    .info-ig .value img { transition: transform 0.3s; flex-shrink: 0; }
    .info-ig:hover .value { color: var(--cyan); }
    .info-ig:hover .value img { transform: scale(1.12); }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes badgeFloat3 {
      0%   { transform: rotate(3deg) translateX(0); }
      40%  { transform: rotate(5deg) translateX(6px) scale(1.04); }
      100% { transform: rotate(3deg) translateX(0); }
    }
    @keyframes badgeFloat4 {
      0%   { transform: rotate(-4deg) translateY(0); }
      50%  { transform: rotate(-6deg) translateY(-8px) scale(1.03); }
      100% { transform: rotate(-4deg) translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      /* Touch screens don't have a mouse cursor */
      .cursor, .cursor-ring { display: none; }
      body { cursor: auto; }
      .wolt-btn, .menu-btn, .contact-link { cursor: pointer; }

      /* Side vertical words — smaller so they don't crowd center content */
      .side-word { font-size: clamp(32px, 8vw, 44px); }
      .side-left  { left: 3px; }
      .side-right { right: 3px; }

      /* Tagline — legible on small screens */
      .tagline { font-size: clamp(9px, 2.8vw, 12px); }

      /* CTA buttons — full-width stack on very narrow screens */
      .cta-group { gap: 8px; }
      .wolt-btn, .menu-btn {
        font-size: clamp(12px, 3.5vw, 15px);
        padding: 11px 20px;
      }

      /* Badges: separate vertically so they don't overlap */
      .badge-3 {
        bottom: clamp(180px, 28vh, 260px);
        left: clamp(12px, 3vw, 30px);
      }
      .badge-4 {
        bottom: clamp(100px, 18vh, 160px);
        right: clamp(12px, 3vw, 30px);
        font-size: clamp(10px, 3vw, 14px);
      }

      /* Top bar — narrower padding on mobile */
      .top-bar {
        padding-left: clamp(100px, 25vw, 140px);
        padding-top: clamp(12px, 2vw, 20px);
        padding-right: 14px;
        padding-bottom: 0;
        align-items: flex-start;
        gap: 10px;
      }
      .top-bar .info-address .value,
      .top-bar .info-ig .value { font-size: 11px; }
      .top-bar .info-ig { align-items: flex-end; }
      .top-bar .info-address { display: none; }
      .contact-links {
        justify-content: flex-end;
        gap: 6px;
        flex-wrap: wrap;
      }
      .contact-link {
        min-height: 32px;
        padding: 8px;
        font-size: 0;
      }
      .contact-link.phone-link {
        font-size: 11px;
        padding: 8px 10px;
      }

      /* Info bar — center only */
      .info-bar { padding: 16px 14px; }
      .info-menu { display: flex; }
    }

    @media (max-width: 400px) {
      /* Extra narrow phones */
      .side-word { display: none; }
      .top-bar { padding-left: 90px; }
      .top-bar .label { display: none; }
      .top-bar .info-ig { display: none; }
      .contact-links { width: 100%; }
    }
  </style>
</head>
<body>

  <div class="cursor" id="cursor"></div>
  <div class="cursor-ring" id="cursorRing"></div>

  <!-- ══════════════════ SINGLE PAGE HERO ══════════════════ -->
  <section class="hero">

    <!-- Video background -->
    <div class="video-wrapper">
      <video autoplay muted loop playsinline preload="auto">
        <source src="Hi_food.mp4" type="video/mp4">
      </video>
    </div>

    <!-- Logo — top left -->
    <div class="logo-wrap">
      <img src="Logo.svg" alt="Hi Food logo">
    </div>

    <!-- Vertical USKORO -->
    <div class="side-word side-left">US<span>KO</span>RO</div>
    <div class="side-word side-right">OT<span>VO</span>RENI</div>

    <!-- Top bar: address + instagram -->
    <div class="top-bar">
      <a href="https://maps.google.com/?q=Križanićeva+1A,+Beograd,+Srbija"
         target="_blank" rel="noopener" class="info-address">
        <span class="label">Adresa</span>
        <span class="value">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          Križanićeva 1A, Beograd
        </span>
      </a>
      <div class="contact-links" aria-label="Kontakt">
        <a href="tel:+381606681992" class="contact-link phone-link" aria-label="Pozovite Hi Food">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.35 1.9.66 2.81a2 2 0 0 1-.45 2.11L8.05 9.91a16 16 0 0 0 6.04 6.04l1.27-1.27a2 2 0 0 1 2.11-.45c.91.31 1.85.53 2.81.66A2 2 0 0 1 22 16.92z"/>
          </svg>
          +381 60 668 1992
        </a>
        <a href="https://t.me/HiFood1" target="_blank" rel="noopener" class="contact-link" aria-label="Telegram Hi Food">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M21.8 4.6 18.6 19.7c-.24 1.08-.87 1.34-1.76.84l-4.86-3.58-2.35 2.26c-.26.26-.48.48-.98.48l.35-4.95 9.02-8.15c.39-.35-.09-.55-.61-.2L6.26 13.39 1.46 11.9c-1.04-.33-1.06-1.04.22-1.54L20.43 3.14c.87-.32 1.63.2 1.37 1.46z"/>
          </svg>
          Telegram
        </a>
        <a href="https://wa.me/381606681992" target="_blank" rel="noopener" class="contact-link" aria-label="WhatsApp Hi Food">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M12.04 2a9.92 9.92 0 0 0-8.55 14.95L2.2 21.8l4.97-1.3A9.93 9.93 0 1 0 12.04 2zm0 18.18a8.2 8.2 0 0 1-4.18-1.15l-.3-.18-2.95.78.79-2.88-.2-.31a8.2 8.2 0 1 1 6.84 3.74zm4.5-6.15c-.25-.12-1.46-.72-1.68-.8-.23-.08-.39-.12-.56.12-.16.25-.64.8-.78.97-.14.16-.29.18-.53.06-.25-.12-1.04-.38-1.98-1.22-.73-.65-1.22-1.45-1.37-1.7-.14-.25-.01-.38.11-.5.11-.11.25-.29.37-.43.12-.15.16-.25.25-.41.08-.17.04-.31-.02-.43-.06-.12-.56-1.34-.76-1.84-.2-.48-.4-.41-.56-.42h-.47c-.16 0-.43.06-.65.31-.23.25-.86.84-.86 2.05 0 1.2.88 2.37 1 2.53.12.17 1.73 2.64 4.19 3.7.59.25 1.04.4 1.4.52.59.19 1.12.16 1.54.1.47-.07 1.46-.6 1.66-1.17.21-.58.21-1.07.15-1.17-.06-.11-.23-.17-.47-.29z"/>
          </svg>
          WhatsApp
        </a>
      </div>
      <a href="https://www.instagram.com/hifoodbg?igsh=MWx3NXBlM2QwZjBmbw%3D%3D&utm_source=qr"
         target="_blank" rel="noopener" class="info-ig">
        <span class="label">Pratite nas</span>
        <span class="value">
          <img src="Instagram_logo_2022.svg" alt="Instagram" width="18" height="18">
          Hi FOOD
        </span>
      </a>
    </div>

    <!-- Floating sticker badges -->
    <div class="badge badge-3">Kavkaski ukusi</div>
    <div class="badge badge-4">Šašlik<span class="dot"></span>Šavarma<span class="dot"></span>Napitci</div>

    <!-- Center tagline -->
    <div class="hero-center">
      <div class="tagline-line">
        <span class="tagline">Već smo otvoreni u Beogradu</span>
      </div>
      <div class="cta-group">
        <a href="https://wolt.com/sr/srb/belgrade/restaurant/hifood"
           target="_blank" rel="noopener" class="wolt-btn">
          <span>Kupujte na</span>
          <img src="wolt.svg" alt="Wolt">
        </a>
        <a href="menu.html" class="menu-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="8" y1="6" x2="21" y2="6"/>
            <line x1="8" y1="12" x2="21" y2="12"/>
            <line x1="8" y1="18" x2="21" y2="18"/>
            <line x1="3" y1="6" x2="3.01" y2="6"/>
            <line x1="3" y1="12" x2="3.01" y2="12"/>
            <line x1="3" y1="18" x2="3.01" y2="18"/>
          </svg>
          Naš Meni
        </a>
      </div>
    </div>

    <!-- Bottom info bar — menu pills only -->
    <div class="info-bar">
      <div class="info-menu">
        <span class="menu-label">Na meniju</span>
        <div class="menu-pills">
          <span class="pill active">Šašlik</span>
          <span class="pill">Šavarma</span>
          <span class="pill">Napitci</span>
        </div>
      </div>
    </div>

  </section>

  <script>
    // Custom cursor
    const cursor = document.getElementById('cursor');
    const ring   = document.getElementById('cursorRing');
    let mx = 0, my = 0, rx = 0, ry = 0;

    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cursor.style.left = mx + 'px';
      cursor.style.top  = my + 'px';
    });

    (function loop() {
      rx += (mx - rx) * 0.11;
      ry += (my - ry) * 0.11;
      ring.style.left = rx + 'px';
      ring.style.top  = ry + 'px';
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
